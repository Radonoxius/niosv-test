[alias]
build-driver = "build --release --target armv7-unknown-linux-gnueabihf"
build-driver-debug = "build --target armv7-unknown-linux-gnueabihf"

build-firmware = "build --release --package niosv-firmware --target riscv32i-unknown-none-elf"
build-firmware-debug = "build --package niosv-firmware --target riscv32i-unknown-none-elf"

[target.armv7-unknown-linux-gnueabihf]
linker = "clang"
rustflags = [
    "-C", "link-arg=--target=armv7-unknown-linux-gnueabihf",
    "-C", "link-arg=-fuse-ld=lld"
]

[target.riscv32i-unknown-none-elf]
rustflags = [
    "-C", "target-feature=+zicsr",
    "-C", "link-arg=-Tmemory.x",
    "-C", "link-arg=-Tlink.x"
]

[env]
RISCV_MTVEC_ALIGN = "128"
RISCV_RT_BASE_ISA = "rv32i"