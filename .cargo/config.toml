[alias]
driver = "build --release --target armv7-unknown-linux-gnueabihf"
driver-dbg = "build --target armv7-unknown-linux-gnueabihf"

firmware-loader = "build --release --package firmware-loader --target armv7-unknown-linux-gnueabihf"

firmware = "build --release --package niosv-main --package niosv-secondary --target riscv32i-unknown-none-elf"
firmware-dbg = "build --package niosv-main --package niosv-secondary --target riscv32i-unknown-none-elf"

[target.armv7-unknown-linux-gnueabihf]
linker = "clang"
rustflags = [
    "-C", "link-arg=--target=armv7-unknown-linux-gnueabihf",
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=--sysroot=/opt/cortexa9t2hf-neon",
    "-C", "link-arg=--gcc-install-dir=/opt/cortexa9t2hf-neon/lib/arm-oe-linux-gnueabi/15.3.0"
]

[target.riscv32i-unknown-none-elf]
rustflags = [
    "-C", "target-feature=+zicsr",
    "-C", "link-arg=-Tmemory.x",
    "-C", "link-arg=-Tlink.x"
]

[env]
RISCV_MTVEC_ALIGN = "128"
RISCV_RT_BASE_ISA = "rv32i"
