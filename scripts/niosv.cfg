adapter driver aji_client
aji_client hardware cablevar {DE-SoC [1-1]}

jtag newtap tap_4BA00477 0 -irlen 4 -expected-id 0x4BA00477
jtag newtap tap_02D020DD 0 -irlen 10 -expected-id 0x02D020DD
vjtag create tap_02D020DD.0.niosv_0 -chain-position tap_02D020DD.0 -expected-id 0x08986E00

target create tap_02D020DD.0.niosv_0.cpu riscv -chain-position tap_02D020DD.0.niosv_0

riscv set_reset_timeout_sec 120
riscv set_command_timeout_sec 120

init
echo "Ready for Remote Connections"
