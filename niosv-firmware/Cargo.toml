[package]
name = "niosv-firmware"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "niosv-firmware"
path = "src/main.rs"
test = false
bench = false

[dependencies]
riscv-rt = { version = "0.18.0", features = ["v-trap", "custom-interrupts", "custom-exceptions"] }
niosv-m-rt = { path = "../niosv-m-rt" }
