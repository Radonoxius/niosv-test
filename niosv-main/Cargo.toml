[package]
name = "niosv-main"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "niosv-main"
path = "src/main.rs"
test = false
bench = false

[dependencies]
riscv = { version = "0.16.1", features = ["rt-v-trap"] }
riscv-rt = { version = "0.18.0", features = ["v-trap", "custom-interrupts", "custom-exceptions"] }
niosv-shared = { path = "../niosv-shared" }